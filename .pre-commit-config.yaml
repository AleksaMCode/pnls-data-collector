# Keep the isort and black versions in sync with requirements-dev.txt, which the GitHub workflows use.
repos:
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        name: isort (python imports)
        args: ["--profile", "black"]
        files: ^(aggregator|collector|firebase_housekeeping|tests|util|collector_metrics_agent|orchestrator|stats|stats_api|ssid_geo_mapper)/
        types: [python]

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        name: black (python formatter)
        files: ^(aggregator|collector|firebase_housekeeping|tests|util|collector_metrics_agent|orchestrator|stats|stats_api|ssid_geo_mapper)/
        types: [python]
