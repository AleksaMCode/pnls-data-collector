# The aggregator, its Celery worker and Flower run the same code. Each builds it, so each can be built
# on its own; built in one command, BuildKit runs the shared steps once, also with --no-cache. They
# have no shared image tag: three builds writing one tag fail on a host with nothing cached.
x-aggregator-image: &aggregator-image
  build:
    context: ..
    dockerfile: aggregator/Dockerfile
  networks:
    - pnls
  env_file:
    - ./.env
  # The secret files the code loads from its folder. The image doesn't contain them (see .dockerignore).
  volumes:
    - ./firebase_credentials.json:/aggregator_service/aggregator/firebase_credentials.json:ro
    - ./private_key.pem:/aggregator_service/aggregator/private_key.pem:ro

services:
  aggregator:
    <<: *aggregator-image
    container_name: aggregator
    environment:
      SERVER_URL: 0.0.0.0
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  aggregator_worker:
    <<: *aggregator-image
    container_name: aggregator_worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
#    command: celery -A aggregator.background.celery:celery worker -E --loglevel=info --concurrency=1 --max-tasks-per-child=1
    command: celery -A aggregator.background.celery:celery worker -E --loglevel=info
    restart: unless-stopped

  postgres:
    # Pinned to the major version the data directory was created with. Postgres cannot start on the data of an
    # older major version, so `latest` could break the database on the next pull. Upgrading needs pg_upgrade or a
    # dump and restore. Keep in sync with POSTGRES_IMAGE in tests/integration/containers.py.
    image: postgres:16
    container_name: postgres
    networks:
      - pnls
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pnls:/data/pgdata
    ports:
      - "${DB_PORT}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 1s
      timeout: 10s
      retries: 50

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    networks:
      - pnls
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "5050:80"
    volumes:
      - pnls:/data/pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.8.0
    container_name: redis
    networks:
      - pnls
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 10s
      retries: 20

  redisinsight:
    image: redis/redisinsight:3.6
    container_name: redisinsight
    networks:
      - pnls
    ports:
      - "${REDIS_INSIGHT_PORT}:5540"
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  flower:
    <<: *aggregator-image
    container_name: flower
    ports:
      - "${FLOWER_PORT}:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A aggregator.background.celery:celery flower --port=5555
    restart: unless-stopped

volumes:
  pnls:
  redis_data:
  redisinsight_data:

networks:
  pnls:
    name: pnls
    driver: bridge