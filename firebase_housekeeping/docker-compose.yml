services:
  firebase_housekeeping:
    build:
      context: ..
      dockerfile: firebase_housekeeping/Dockerfile
    container_name: firebase_housekeeping
    networks:
      - pnls
    env_file:
      - ./.env
    environment:
      SERVER_URL: 0.0.0.0
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    # depends_on:
    #   mongodb:
    #     condition: service_healthy

  mongodb:
    image: mongo:latest
    container_name: mongodb
    networks:
      - pnls
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - pnls:/data/mongodata
    ports:
      - "${MONGO_PORT}:27017"
    restart: unless-stopped
#    healthcheck:
#      test:
#        [
#          "CMD-SHELL",
#          'mongosh --quiet --eval "db.adminCommand(''ping'').ok" || exit 1',
#        ]
#      interval: 5s
#      timeout: 10s
#      retries: 20

volumes:
  pnls:

networks:
  pnls:
    name: pnls
    driver: bridge
    external: true
