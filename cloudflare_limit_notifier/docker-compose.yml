services:
  cloudflare_limit_notifier:
    build:
      context: ..
      dockerfile: cloudflare_limit_notifier/Dockerfile
    container_name: cloudflare_limit_notifier
    env_file:
      - ./.env
    environment:
      TZ: Europe/Paris
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    # The service stops at start-up without a .env file, which the image doesn't contain.
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
