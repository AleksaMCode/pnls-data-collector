# Ruff is used for linting only. Formatting is done by Black and import sorting by isort.
# The code already uses Python 3.12 syntax (nested quotes in f-strings).
target-version = "py312"
extend-exclude = ["logs"]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes: unused and undefined names
    "B",     # flake8-bugbear: likely bugs
    "UP",    # pyupgrade: outdated syntax
    "ASYNC", # blocking calls inside async functions
]
ignore = [
    "E501",  # Line length is handled by Black.
    "UP042", # Replacing `str, Enum` with `StrEnum` changes how the members are printed.
]

[lint.per-file-ignores]
# Names imported in a package's __init__.py are re-exports.
"__init__.py" = ["F401"]

[lint.flake8-bugbear]
# FastAPI reads these calls from the argument defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Query"]
