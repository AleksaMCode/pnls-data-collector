name: Go Code Style Check

on:
  push:
    branches: [master]
    paths:
      - "**/*.go"
      - ".go-version"
      - "**/go.mod"
      - "**/go.sum"
  pull_request:
    branches: [master]
    paths:
      - "**/*.go"
      - ".go-version"
      - "**/go.mod"
      - "**/go.sum"

jobs:
  format-check:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Install golangci-lint
        run: |
          # Pinned: bump together with .go-version.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint fmt check (collector_status_notifier)
        run: |
          cd collector_status_notifier
          golangci-lint fmt
          git diff --exit-code

      - name: Run golangci-lint fmt check (firebase_limit_notifier)
        run: |
          cd firebase_limit_notifier
          golangci-lint fmt
          git diff --exit-code

      - name: Run golangci-lint fmt check (util-go)
        run: |
          cd util-go
          golangci-lint fmt
          git diff --exit-code

      - name: Run golangci-lint fmt check (db_backup)
        run: |
          cd db_backup
          golangci-lint fmt
          git diff --exit-code

      - name: Run golangci-lint fmt check (cloudflare_limit_notifier)
        run: |
          cd cloudflare_limit_notifier
          golangci-lint fmt
          git diff --exit-code

      - name: Run golangci-lint fmt check (home_server_limit_notifier)
        run: |
          cd home_server_limit_notifier
          golangci-lint fmt
          git diff --exit-code
