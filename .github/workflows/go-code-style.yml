name: Go Code Style Check

on:
  push:
    branches: [master]
    paths:
      - "**/*.go"
      - ".go-version"
      - "**/go.mod"
      - "**/go.sum"
      - "**/.golangci.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/*.go"
      - ".go-version"
      - "**/go.mod"
      - "**/go.sum"
      - "**/.golangci.yml"

jobs:
  format-check:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version

      - name: Install golangci-lint
        run: |
          # Pinned: bump together with .go-version.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Reports both formatting and lint issues, for every Go module.
      - name: Run golangci-lint format and lint check (all modules)
        run: make -k lint-go
