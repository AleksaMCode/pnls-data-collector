name: PNLS-DC Go Tests

on:
  push:
    branches: [master]
    paths:
      - "collector_status_notifier/**/*.go"
      - "firebase_limit_notifier/**/*.go"
      - "util-go/**/*.go"
      - "db_backup/**/*.go"
      # The db_backup tests check the workflow definitions and back up the seed.
      - "db_backup/workflows/**"
      - "db_backup/testdata/**"
      - "cloudflare_limit_notifier/**/*.go"
      - "home_server_limit_notifier/**/*.go"
      - ".go-version"
      - "**/go.mod"
      - "**/go.sum"
      - "codecov.yml"
      - ".github/workflows/go-tests.yml"
      # The Go integration tests build the Firebase emulator image from this folder.
      - "tests/integration/firebase_emulator/**"
  pull_request:
    branches: [master]
    paths:
      - "collector_status_notifier/**/*.go"
      - "firebase_limit_notifier/**/*.go"
      - "util-go/**/*.go"
      - "db_backup/**/*.go"
      # The db_backup tests check the workflow definitions and back up the seed.
      - "db_backup/workflows/**"
      - "db_backup/testdata/**"
      - "cloudflare_limit_notifier/**/*.go"
      - "home_server_limit_notifier/**/*.go"
      - ".go-version"
      - "**/go.mod"
      - "**/go.sum"
      - "codecov.yml"
      - ".github/workflows/go-tests.yml"
      # The Go integration tests build the Firebase emulator image from this folder.
      - "tests/integration/firebase_emulator/**"

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: |
            collector_status_notifier/go.sum
            firebase_limit_notifier/go.sum
            util-go/go.sum
            db_backup/go.sum
            cloudflare_limit_notifier/go.sum
            home_server_limit_notifier/go.sum

      - name: Run collector_status_notifier tests
        run: |
          cd collector_status_notifier
          go mod download
          go test -v -coverprofile=coverage.out -covermode=atomic

      - name: Run firebase_limit_notifier tests
        run: |
          cd firebase_limit_notifier
          go mod download
          go test -v -tags=integration -coverprofile=coverage.out -covermode=atomic

      - name: Run util-go tests
        run: |
          cd util-go
          go mod download
          go test -v -tags=integration -coverprofile=coverage.out -covermode=atomic ./...

      # The db_backup integration tests run pg_dump on the runner, as the worker writes the dump to its own disk.
      - name: Install pg_dump
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run db_backup tests
        run: |
          cd db_backup
          go mod download
          # The integration tests also cover config and conductor, so every package counts for every test binary.
          go test -v -tags=integration -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run cloudflare_limit_notifier tests
        run: |
          cd cloudflare_limit_notifier
          go mod download
          go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run home_server_limit_notifier tests
        run: |
          cd home_server_limit_notifier
          go mod download
          go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: collector_status_notifier/coverage.out,firebase_limit_notifier/coverage.out,util-go/coverage.out,db_backup/coverage.out,cloudflare_limit_notifier/coverage.out,home_server_limit_notifier/coverage.out
          flags: go
          disable_search: true
