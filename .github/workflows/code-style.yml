name: Code Style Check

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Run black check
        run: black --check .
