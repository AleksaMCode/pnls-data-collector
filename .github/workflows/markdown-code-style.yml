name: Markdown Code Style Check

on:
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - "package.json"
      - "package-lock.json"
      - ".markdownlint-cli2.jsonc"
      - ".prettierrc"
      - ".prettierignore"
      - ".nvmrc"
  pull_request:
    branches: [master]
    paths:
      - "**/*.md"
      - "package.json"
      - "package-lock.json"
      - ".markdownlint-cli2.jsonc"
      - ".prettierrc"
      - ".prettierignore"
      - ".nvmrc"

jobs:
  markdown:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run fmt:markdown:check

      - name: Run markdownlint
        if: ${{ !cancelled() }}
        run: npm run lint:markdown
