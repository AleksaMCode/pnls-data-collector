name: PNLS collector tests

on:
  push:
    branches: master
  pull_request:
    branches: master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: python -m pip install --upgrade pip && python -m pip install pycryptodome

    - name: Prepare settings
      run: cp settings.py.template settings.py

    - name: Run tests (unittest discover)
      run: python -m unittest discover -v
