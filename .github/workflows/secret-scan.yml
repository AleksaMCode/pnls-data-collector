name: Secret Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # New detection rules can find secrets in commits that are already in the history.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Gitleaks scans every commit, not only the checked out files.
          fetch-depth: 0

      # Keep the version in sync with .pre-commit-config.yaml.
      # Accepted findings are listed in .gitleaksignore.
      # --redact keeps a found secret out of the public workflow log.
      - name: Run Gitleaks on the full git history
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner
