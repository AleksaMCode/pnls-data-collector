name: PNLS-DC Python Tests

on:
  pull_request:
    branches: [master]
    paths:
      - "aggregator/**/*.py"
      - "collector/**/*.py"
      - "stats_api/**/*.py"
      - "stats/**/*.py"
      - "tests/**/*.py"
      - "util/**/*.py"
      - "ssid_geo_mapper/**/*.py"
      - "firebase_housekeeping/**/*.py"
      - "collector_metrics_agent/**/*.py"
      - "tests/requirements.txt"
      # The integration tests build the database from the migrations, seed fixtures and run the Firebase emulator image.
      - "aggregator/migrations/**"
      - "tests/integration/fixtures/**"
      - "tests/integration/firebase_emulator/**"
      - ".coveragerc"
      - "codecov.yml"
      - ".github/workflows/python-tests.yml"
      - ".python-version"
  push:
    branches: [master]
    paths:
      - "aggregator/**/*.py"
      - "collector/**/*.py"
      - "stats_api/**/*.py"
      - "stats/**/*.py"
      - "tests/**/*.py"
      - "util/**/*.py"
      - "ssid_geo_mapper/**/*.py"
      - "firebase_housekeeping/**/*.py"
      - "collector_metrics_agent/**/*.py"
      - "tests/requirements.txt"
      # The integration tests build the database from the migrations, seed fixtures and run the Firebase emulator image.
      - "aggregator/migrations/**"
      - "tests/integration/fixtures/**"
      - "tests/integration/firebase_emulator/**"
      - ".coveragerc"
      - "codecov.yml"
      - ".github/workflows/python-tests.yml"
      - ".python-version"

jobs:
  test:
    runs-on: ubuntu-26.04

    env:
      ENV: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r tests/requirements.txt

      - name: Prepare settings modules
        run: |
          cp aggregator/settings.py.template aggregator/settings.py
          cp firebase_housekeeping/settings.py.template firebase_housekeeping/settings.py
          cp collector/settings.py.template collector/settings.py

      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest discover -v -s tests/unit -t .

      # Runs even when a unit test failed, so both results show in one CI run.
      # `--append` adds to the unit test coverage instead of replacing it.
      - name: Run integration tests with coverage
        if: ${{ !cancelled() }}
        run: python -m coverage run --append -m unittest discover -v -s tests/integration -t .

      - name: Create coverage report
        run: |
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          disable_search: true
