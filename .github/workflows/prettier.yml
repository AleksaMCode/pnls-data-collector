name: Prettier and ESLint Code Style Check (monitor-dashboard)

on:
  push:
    branches: [master]
    paths:
      - "monitor_dashboard/**"
  pull_request:
    branches: [master]
    paths:
      - "monitor_dashboard/**"

jobs:
  prettier:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: monitor_dashboard/.nvmrc
          cache: "npm"
          cache-dependency-path: monitor_dashboard/package-lock.json

      - name: Install dependencies
        working-directory: monitor_dashboard
        run: npm ci

      - name: Run Prettier check
        working-directory: monitor_dashboard
        run: |
          npx prettier --check "**/*.{js,jsx,ts,tsx}"

      - name: Run ESLint
        if: ${{ !cancelled() }}
        working-directory: monitor_dashboard
        run: npm run lint
