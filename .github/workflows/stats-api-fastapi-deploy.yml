name: Stats API FastAPI Deploy

on:
  push:
    branches:
      - master
    paths:
      - "stats_api/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stats_api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FastAPI CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi[standard]"

      - name: Deploy to FastAPI Cloud
        run: fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
