name: Security

on:
  push:
    branches: [master]
    paths:
      - "monitor_dashboard/package.json"
      - "monitor_dashboard/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".go-version"
      - ".python-version"
      - "**/requirements.txt"
      - "requirements-dev.txt"
      - "stats_api/pyproject.toml"
      - "scripts/check_util_requirements_sync.py"
      - "**/Dockerfile"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [master]
    paths:
      - "monitor_dashboard/package.json"
      - "monitor_dashboard/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".go-version"
      - ".python-version"
      - "**/requirements.txt"
      - "requirements-dev.txt"
      - "stats_api/pyproject.toml"
      - "scripts/check_util_requirements_sync.py"
      - "**/Dockerfile"
      - ".github/workflows/security.yml"
  # New advisories are published without any change to the repo.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: monitor_dashboard/.nvmrc

      - name: Run npm audit (production dependencies)
        working-directory: monitor_dashboard
        run: npm audit --omit=dev --package-lock-only

      - name: Run npm audit (including dev dependencies)
        continue-on-error: true
        working-directory: monitor_dashboard
        run: npm audit --package-lock-only

      # The root package.json only holds development tools for the Markdown files.
      - name: Run npm audit (root Markdown tools)
        continue-on-error: true
        run: npm audit --package-lock-only

  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        module:
          - cloudflare_limit_notifier
          - collector_status_notifier
          - db_backup
          - firebase_limit_notifier
          - home_server_limit_notifier
          - util-go

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: make audit

  pip-audit:
    name: pip-audit (${{ matrix.service }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        service:
          - aggregator
          - collector
          - collector_metrics_agent
          - firebase_housekeeping
          - orchestrator
          - ssid_geo_mapper
          - stats
          - stats_api
          - tests
          - util

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install pip-audit
        run: python -m pip install -r requirements-dev.txt

      - name: Check requirements.txt and pyproject.toml list the same dependencies
        if: matrix.service == 'stats_api'
        working-directory: ${{ matrix.service }}
        run: make check-dependencies-sync

      - name: Run pip-audit
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.service }}
        run: make audit

  pip-audit-dev-tools:
    name: pip-audit (requirements-dev.txt)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install pip-audit
        run: python -m pip install -r requirements-dev.txt

      - name: Run pip-audit
        run: python -m pip_audit -r requirements-dev.txt

  util-requirements-sync:
    name: util requirements sync
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Check the Python services pin shared dependencies the same as util
        run: make check-util-requirements-sync

  # Builds the Docker images of this repo and scans them for OS and library vulnerabilities.
  trivy-image-scan:
    name: trivy (${{ matrix.image }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # React
          - image: monitor_dashboard
            context: monitor_dashboard
            dockerfile: monitor_dashboard/Dockerfile
          # Go
          - image: cloudflare_limit_notifier
            context: .
            dockerfile: cloudflare_limit_notifier/Dockerfile
          - image: collector_status_notifier
            context: .
            dockerfile: collector_status_notifier/Dockerfile
          - image: firebase_limit_notifier
            context: .
            dockerfile: firebase_limit_notifier/Dockerfile
          - image: db_backup
            context: .
            dockerfile: db_backup/Dockerfile
          # Python
          - image: aggregator
            context: .
            dockerfile: aggregator/Dockerfile
          - image: firebase_housekeeping
            context: .
            dockerfile: firebase_housekeeping/Dockerfile
          - image: ssid_geo_mapper
            context: .
            dockerfile: ssid_geo_mapper/Dockerfile
          - image: stats
            context: .
            dockerfile: stats/Dockerfile
          - image: stats_api
            context: .
            dockerfile: stats_api/Dockerfile

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The Cloudflare image copies its .env file, which is not in the repo, so an empty one stands in for it.
      - name: Create placeholder .env
        if: matrix.image == 'cloudflare_limit_notifier'
        run: touch cloudflare_limit_notifier/.env

      - name: Build image
        run: docker build -t ${{ matrix.image }}:scan -f ${{ matrix.dockerfile }} ${{ matrix.context }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          # Only report vulnerabilities that have a fixed version to upgrade to
          ignore-unfixed: true
          exit-code: "1"
