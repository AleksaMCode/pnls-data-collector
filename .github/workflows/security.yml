name: Security

on:
  push:
    branches: [master]
    paths:
      - "monitor_dashboard/package.json"
      - "monitor_dashboard/package-lock.json"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [master]
    paths:
      - "monitor_dashboard/package.json"
      - "monitor_dashboard/package-lock.json"
      - ".github/workflows/security.yml"
  # New advisories are published without any change to the repo.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm audit (monitor-dashboard)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run npm audit
        working-directory: monitor_dashboard
        run: npm audit --omit=dev
