services:
  #  airflow-postgres:
  #    image: postgres:latest
  #    container_name: airflow-postgres
  #    env_file:
  #      - ./.env
  #    environment:
  #      POSTGRES_USER: ${AIRFLOW_DB_USER}
  #      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
  #      POSTGRES_DB: ${AIRFLOW_DB_NAME}
  #    ports:
  #      - "${AIRFLOW_DB_PORT}:5433"
  #    volumes:
  #      - airflow-postgres-db-volume:/var/lib/postgresql/data
  #    healthcheck:
  #      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
  #      interval: 5s
  #      retries: 5
  #    restart: unless-stopped

  airflow-init:
    image: apache/airflow:3.1.3
    container_name: airflow-init
    #    depends_on:
    #      airflow-postgres:
    #        condition: service_healthy
    env_file:
      - ./.env
    environment:
      AIRFLOW__EXECUTOR__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:5432/${AIRFLOW_DB_NAME}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD}
      AGGREGATOR_BASE_URL: ${AGGREGATOR_BASE_URL}
      HOUSEKEEPING_BASE_URL: ${HOUSEKEEPING_BASE_URL}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS}
      HOUSEKEEPING_EVERY_N_DAYS: ${HOUSEKEEPING_EVERY_N_DAYS}
      HOUSEKEEPING_ANCHOR_DATE: ${HOUSEKEEPING_ANCHOR_DATE}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    user: "0:0"
    networks:
      - default
      - pnls
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./requirements.txt:/requirements.txt
    command: bash -c "airflow db migrate && airflow users create --username ${AIRFLOW_USERNAME} --password ${AIRFLOW_PASSWORD} --firstname PNLS --lastname Admin --role Admin --email admin@pnls.local"

  airflow-webserver:
    image: apache/airflow:3.1.3
    container_name: airflow-webserver
#    depends_on:
#      #      airflow-postgres:
#      #        condition: service_healthy
#      airflow-init:
#        condition: service_completed_successfully
    env_file:
      - ./.env
    networks:
      - default
      - pnls
    environment:
      AIRFLOW__EXECUTOR__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
#      AIRFLOW__CORE__PARALLELISM: 2
#      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
#      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./requirements.txt:/requirements.txt
    ports:
      - "${AIRFLOW_PORT}:8080"
    command: bash -c "airflow api-server"
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:3.1.3
    container_name: airflow-scheduler
#    depends_on:
#      #      airflow-postgres:
#      #        condition: service_healthy
#      airflow-init:
#        condition: service_completed_successfully
    env_file:
      - ./.env
    networks:
      - default
      - pnls
    environment:
      AIRFLOW__EXECUTOR__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__PARALLELISM: 2
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
      AIRFLOW__EXECUTION_API__SERVER_URL: http://airflow-webserver:8080
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./requirements.txt:/requirements.txt
    command: bash -c "airflow scheduler"
    restart: unless-stopped

  airflow-dag-processor:
    image: apache/airflow:3.1.3
    container_name: airflow-dag-processor
    env_file:
      - ./.env
    networks:
      - default
      - pnls
    environment:
      AIRFLOW__EXECUTOR__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@${AIRFLOW_DB_HOST}:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__PARALLELISM: 2
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./requirements.txt:/requirements.txt
    command: bash -c "airflow dag-processor"
    restart: unless-stopped

volumes:
  airflow-postgres-db-volume:

networks:
  pnls:
    name: pnls
    driver: bridge
    external: true
